name: 💡 Feature Request
description: Propose a new feature, workflow improvement, or enhancement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us improve Aicrosoft products! Please share your thoughts and suggestions below.
  - type: dropdown
    id: product
    attributes:
      label: Target Product
      description: Select which product this suggestion applies to.
      options:
        - BookFun (悦读)
        - TrueCost Auto
        - FlashNote (流光笔记)
        - KinTime (家时光)
        - SavorDaily (三餐四季)
        - Ecosystem / Cross-app
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: What challenge or inconvenience are you facing, or what is the background for this request?
      placeholder: "When reading long documents in BookFun, I often need..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution & Expected Behavior
      description: Clearly describe the feature you would like to see and how it should work.
      placeholder: "Add an option to customize the shortcut or..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered (Optional)
      description: Have you considered or tried any workarounds?
      placeholder: "Currently I manually export to..."
    validations:
      required: false
