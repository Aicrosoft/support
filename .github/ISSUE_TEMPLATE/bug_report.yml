name: 🐛 Bug Report
description: Report a crash, malfunction, or unexpected behavior in any Aicrosoft product.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you are running the latest version of the app before submitting.
  - type: dropdown
    id: product
    attributes:
      label: Product Name
      description: Select the Aicrosoft application or service experiencing the issue.
      options:
        - BookFun (悦读)
        - TrueCost Auto
        - FlashNote (流光笔记)
        - KinTime (家时光)
        - SavorDaily (三餐四季)
        - Other / Ecosystem
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      description: What version of the application are you using?
      placeholder: "e.g., v2.1.0 (Build 2026.11)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating System & Device
      description: Specify your device model and OS/browser version.
      placeholder: "e.g., iOS 17.5 / iPhone 15 Pro, Android 14 / Pixel 8, macOS 14.5 / Chrome 125"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps explaining how to reproduce the issue.
      placeholder: |
        1. Open the app...
        2. Navigate to...
        3. Click on...
        4. See error or crash.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
      placeholder: "Expected the audio to play continuously; instead, the app crashed immediately."
    validations:
      required: true
  - type: textarea
    id: logs-screenshots
    attributes:
      label: Screenshots or Logs (Optional)
      description: Drag and drop screenshots, screen recordings, or paste relevant error logs here.
      placeholder: "Drop images/logs here..."
    validations:
      required: false
